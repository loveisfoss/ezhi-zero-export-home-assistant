# EZHI low battery mode
#
# Switches from "Zero export" to "Stable output (auto)" when the battery state of charge
# drops below 17 %. Does nothing in any Stable output mode (you are already at the fixed output).
#
# Replace before use:
#   sensor.YOUR_EZHI_BATTERY_SOC_SENSOR -> battery state of charge in %
#
# Tunable: "below: 17" = SoC threshold in %
# Pair it with battery-recovered.yaml and keep a sensible gap between the two thresholds.
#
# Requires helper: input_select.ezhi_mode

alias: EZHI low battery mode
description: ''
triggers:
  - trigger: numeric_state
    entity_id: sensor.YOUR_EZHI_BATTERY_SOC_SENSOR
    below: 17
conditions:
  - condition: state
    entity_id: input_select.ezhi_mode
    state: Zero export
actions:
  - action: input_select.select_option
    metadata: {}
    target:
      entity_id: input_select.ezhi_mode
    data:
      option: Stable output (auto)
mode: single
