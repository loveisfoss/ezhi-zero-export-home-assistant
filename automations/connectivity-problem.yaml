# EZHI connectivity problem
#
# If the battery SoC sensor or the grid meter becomes unavailable/unknown, switch from
# "Zero export" to "Stable output (auto)" and always send a persistent notification plus
# a phone notification. In "Stable output (permanent)" the mode is left as it is.
#
# Replace before use:
#   sensor.YOUR_EZHI_BATTERY_SOC_SENSOR -> battery state of charge in %
#   sensor.YOUR_GRID_POWER_SENSOR       -> grid meter power in W
#   notify.mobile_app_YOUR_PHONE        -> notify service of your phone
#                                          (Developer Tools > Actions, search "notify.")
#
# Note: if the SoC sensor was the one that dropped out, battery-recovered.yaml may switch
# back to Zero export when the sensor returns. Use "Stable output (permanent)" below if you
# want to decide yourself.
#
# Requires helper: input_select.ezhi_mode

alias: EZHI connectivity problem
description: ''
triggers:
  - trigger: state
    entity_id:
      - sensor.YOUR_EZHI_BATTERY_SOC_SENSOR
    to:
      - unavailable
      - unknown
  - trigger: state
    entity_id:
      - sensor.YOUR_GRID_POWER_SENSOR
    to:
      - unavailable
      - unknown
conditions: []
actions:
  - if:
      - condition: state
        entity_id: input_select.ezhi_mode
        state: Zero export
    then:
      - action: input_select.select_option
        metadata: {}
        target:
          entity_id: input_select.ezhi_mode
        data:
          option: Stable output (auto)
  - action: notify.persistent_notification
    metadata: {}
    data:
      message: >-
        EZHI Warning! EZHI or grid meter connectivity problem. EZHI is now in
        Stable output mode. Check the system before switching back to Zero
        export.
  - action: notify.mobile_app_YOUR_PHONE
    metadata: {}
    data:
      message: >-
        EZHI or grid meter connectivity problem. EZHI is now in Stable output mode.
        Check the system before switching back to Zero export.
      title: EZHI Warning!
mode: single
