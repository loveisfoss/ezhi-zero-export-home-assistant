# EZHI connectivity problem
#
# If the battery SoC sensor or the grid meter becomes unavailable/unknown (even for a
# moment), switch from "Zero export" to "Stable output (auto)" and always send a
# persistent notification plus a phone notification. In "Stable output (permanent)"
# the mode is left as it is. The notification names the sensor that dropped out.
# connectivity-recovery.yaml switches back to "Zero export" once the sensors are stable.
#
# Replace before use:
#   sensor.YOUR_EZHI_BATTERY_SOC_SENSOR -> battery state of charge in %
#   sensor.YOUR_GRID_POWER_SENSOR       -> grid meter power in W
#   notify.mobile_app_YOUR_PHONE        -> notify service of your phone
#                                          (Developer Tools > Actions, search "notify.")
#
# Tunable: the "It will return..." text in the outcome variable (3 minutes and 17 %) should
# match the values used in connectivity-recovery.yaml.
#
# Requires helper: input_select.ezhi_mode

alias: EZHI connectivity problem
description: ''
triggers:
  - trigger: state
    entity_id:
      - sensor.YOUR_EZHI_BATTERY_SOC_SENSOR
    to:
      - unavailable
      - unknown
  - trigger: state
    entity_id:
      - sensor.YOUR_GRID_POWER_SENSOR
    to:
      - unavailable
      - unknown
conditions: []
actions:
  - variables:
      previous_mode: "{{ states('input_select.ezhi_mode') }}"
      problem: >-
        {% if trigger is defined and trigger.to_state is defined
              and trigger.to_state is not none %}
        {{ trigger.to_state.name }} is {{ trigger.to_state.state }}.
        {% else %}
        A sensor is unavailable.
        {% endif %}
  - variables:
      outcome: >-
        {% if previous_mode == 'Zero export' %}
        Switched to Stable output (auto). It will return to Zero export
        automatically once both sensors have been stable for 3 minutes and the
        battery is above 17 %.
        {% else %}
        Mode left unchanged: {{ previous_mode }}.
        {% endif %}
  - if:
      - condition: state
        entity_id: input_select.ezhi_mode
        state: Zero export
    then:
      - action: input_select.select_option
        metadata: {}
        target:
          entity_id: input_select.ezhi_mode
        data:
          option: Stable output (auto)
  - action: notify.persistent_notification
    metadata: {}
    data:
      message: >-
        EZHI Warning! {{ problem }} {{ outcome }}
  - action: notify.mobile_app_YOUR_PHONE
    metadata: {}
    data:
      message: >-
        {{ problem }} {{ outcome }}
      title: EZHI Warning!
mode: single
