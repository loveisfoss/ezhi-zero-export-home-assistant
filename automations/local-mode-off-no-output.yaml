# EZHI local mode off - set no output
#
# When input_boolean.ezhi_local_mode is switched off, set the output mode to "No output" and
# the power limit to 0 W. It has no conditions on purpose: it must run when local mode is
# already off. After you switch local mode on again, the mode stays at "No output" until you
# select another one.
#
# Replace before use:
#   number.YOUR_EZHI_POWER_LIMIT -> number entity that sets the EZHI on-grid power limit
#
# In cloud mode a write to the power limit succeeds but has no effect on the real output, so the
# 0 W write only matters while the inverter is still in Local mode. The mode is set first.
#
# Requires helpers: input_select.ezhi_output_mode, input_boolean.ezhi_local_mode

alias: EZHI local mode off - set no output
description: ''
triggers:
  - trigger: state
    entity_id: input_boolean.ezhi_local_mode
    to: 'off'
conditions: []
actions:
  - action: input_select.select_option
    metadata: {}
    target:
      entity_id: input_select.ezhi_output_mode
    data:
      option: No output
  - action: number.set_value
    metadata: {}
    target:
      entity_id: number.YOUR_EZHI_POWER_LIMIT
    data:
      value: '0'
mode: single
