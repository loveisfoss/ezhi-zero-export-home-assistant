# EZHI stable output - Timed check
#
# Every minute, while the mode is "Stable output (auto)" or "Stable output (permanent)",
# write the stable output power again so the inverter stays at that value. A changed
# stable output power is applied within a minute.
# Does nothing while input_boolean.ezhi_local_mode is off.
#
# Replace before use:
#   number.YOUR_EZHI_POWER_LIMIT -> number entity that sets the EZHI on-grid power limit
#
# Adjustable value: input_number.ezhi_stable_power -> stable output power in W (default 40)
# Tunable: "/1" = check interval in minutes
#
# Requires helpers: input_select.ezhi_output_mode, input_boolean.ezhi_local_mode,
# input_number.ezhi_stable_power

alias: EZHI stable output - Timed check
description: ''
triggers:
  - trigger: time_pattern
    minutes: /1
conditions:
  - condition: state
    entity_id: input_boolean.ezhi_local_mode
    state: 'on'
  - condition: state
    entity_id: input_select.ezhi_output_mode
    state:
      - Stable output (auto)
      - Stable output (permanent)
actions:
  - action: number.set_value
    metadata: {}
    target:
      entity_id: number.YOUR_EZHI_POWER_LIMIT
    data:
      value: "{{ states('input_number.ezhi_stable_power') | float(40) | round(0) }}"
mode: single
