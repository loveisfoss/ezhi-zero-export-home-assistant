# EZHI no output - Timed check
#
# Every minute, while the mode is "No output", set the power limit to 0 W again if it is not
# already 0, so the inverter stays at no output.
# Does nothing while input_boolean.ezhi_local_mode is off.
#
# Replace before use:
#   number.YOUR_EZHI_POWER_LIMIT -> number entity that sets the EZHI on-grid power limit
#
# Tunable: "/1" = check interval in minutes
#
# Requires helpers: input_select.ezhi_output_mode, input_boolean.ezhi_local_mode

alias: EZHI no output - Timed check
description: ''
triggers:
  - trigger: time_pattern
    minutes: /1
conditions:
  - condition: state
    entity_id: input_select.ezhi_output_mode
    state: No output
  - condition: template
    value_template: |
      {{ is_number(states('number.YOUR_EZHI_POWER_LIMIT'))
         and states('number.YOUR_EZHI_POWER_LIMIT') | float != 0 }}
  - condition: state
    entity_id: input_boolean.ezhi_local_mode
    state: 'on'
actions:
  - action: number.set_value
    metadata: {}
    target:
      entity_id: number.YOUR_EZHI_POWER_LIMIT
    data:
      value: '0'
mode: single
