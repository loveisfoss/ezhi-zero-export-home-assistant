# EZHI zero export
#
# Keeps grid import slightly above 0 W by adjusting the EZHI on-grid power limit.
# Runs only while input_boolean.ezhi_local_mode is on and input_select.ezhi_output_mode = "Zero export",
# and starts immediately when the mode is switched to Zero export from any other mode.
#
# Replace before use:
#   sensor.YOUR_GRID_POWER_SENSOR   -> grid meter power in W (positive = import, negative = export)
#   number.YOUR_EZHI_POWER_LIMIT    -> number entity that sets the EZHI on-grid power limit
#
# Adjustable values (Number helpers, see helpers/ezhi-adjustable-values.md):
#   input_number.ezhi_zero_export_target    -> target grid import in W (default 4)
#   input_number.ezhi_zero_export_band_min  -> no action while grid power is inside the band
#   input_number.ezhi_zero_export_band_max     (default 0 to 8 W)
#   input_number.ezhi_max_power_limit       -> maximum power limit in W, 30 to 1200 (my value 800)
# Fixed: the 30 W minimum power limit. The cooldown is set in the timer helper timer.ezhi_cooldown
# (the automation starts the timer without its own duration).
#
# Requires helpers: input_select.ezhi_output_mode, timer.ezhi_cooldown, input_boolean.ezhi_local_mode
# and the number helpers above

alias: EZHI zero export
description: ''
triggers:
  - trigger: state
    entity_id:
      - sensor.YOUR_GRID_POWER_SENSOR
  - trigger: state
    entity_id:
      - input_select.ezhi_output_mode
    from:
      - Stable output (auto)
      - Stable output (permanent)
      - No output
    to:
      - Zero export
conditions:
  - condition: state
    entity_id: input_boolean.ezhi_local_mode
    state: 'on'
  - condition: state
    entity_id: input_select.ezhi_output_mode
    state: Zero export
  - condition: state
    entity_id: timer.ezhi_cooldown
    state: idle
  - condition: template
    value_template: |
      {{ has_value('sensor.YOUR_GRID_POWER_SENSOR')
         and has_value('number.YOUR_EZHI_POWER_LIMIT') }}
  - condition: template
    value_template: |
      {% set grid_power =
        states('sensor.YOUR_GRID_POWER_SENSOR')
        | float(0) %}
      {{ grid_power < states('input_number.ezhi_zero_export_band_min') | float(0)
         or grid_power > states('input_number.ezhi_zero_export_band_max') | float(8) }}
actions:
  - variables:
      grid_power: |
        {{ states('sensor.YOUR_GRID_POWER_SENSOR')
           | float(0) }}
      ezhi_power: |
        {{ states('number.YOUR_EZHI_POWER_LIMIT')
           | float(0) }}
      target_import: |
        {{ states('input_number.ezhi_zero_export_target') | float(4) }}
      max_power: |
        {{ states('input_number.ezhi_max_power_limit') | float(800) }}
  - variables:
      new_power: >
        {% set calculated = ezhi_power + grid_power - target_import %} {{ [[calculated, 30]
        | max, max_power] | min | round(0) }}
  - condition: template
    value_template: |
      {{ new_power | float != ezhi_power | float }}
  - action: number.set_value
    target:
      entity_id: number.YOUR_EZHI_POWER_LIMIT
    data:
      value: '{{ new_power }}'
  - action: timer.start
    target:
      entity_id: timer.ezhi_cooldown
mode: single
